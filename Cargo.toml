[package]
name = "rubic"
version = "1.2.0"
edition = "2021"
authors = ["Matthew Darnell"]
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "rubic"
crate-type = ["lib"]

[[bin]]
name = "rubic"
test = false

[dependencies]
dotenv = "0.15.0"
dotenv_codegen = "0.15.0"
rocket = { version = "0.5.0-rc.3", features = ["json"] }
spmc = "0.3.0"

api = { path = './api' }
crypto =  { path = './crypto' }
protocol = { path = './protocol' }
logger = { path = './logger' }
miner = { path = './miner' }
network = { path = './network' }
smart_contract = { path = './smart_contract' }
store = { path = './store' }
hex = "0.4.3"
base64 = "0.23.1"
once_cell = "1.21.4"

[profile.test]  # Disable Overflow Checks For FourQ Operations
overflow-checks = false

[profile.dev]
overflow-checks = false

# Dependencies (argon2, pbkdf2/sha2, chacha20poly1305, the crypto crate) run at
# release speed in debug builds; unoptimized they make every unlock take seconds.
[profile.dev.package."*"]
opt-level = 3
